name: Release

# Publishes to PyPI whenever a version tag (e.g. v2.0.0) is pushed.
# Version is derived from the tag by setuptools_scm.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token secret needed.
# One-time setup on PyPI: add a trusted publisher for project "illumio-py-open"
#   Owner: alexgoller  |  Repo: illumio-py  |  Workflow: release.yml  |  Environment: pypi
# (Token alternative: set a PYPI_API_TOKEN secret and pass `password:` to the
#  publish action instead of using id-token.)

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . requests-mock pytest pytest-cov
          python -m pytest tests/unit -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so setuptools_scm sees the version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/illumio-py-open
    permissions:
      id-token: write   # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
