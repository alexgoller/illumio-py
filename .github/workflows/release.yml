name: Release

# Builds on every version tag (vX.Y.Z...) and publishes:
#   - pre-release tags (e.g. v2.0.0rc1, v2.0.0a1, v2.0.0.dev1) -> TestPyPI (dry run)
#   - final tags (e.g. v2.0.0)                                 -> PyPI
# Version is derived from the tag by setuptools_scm.
#
# Publishing uses Trusted Publishing (OIDC) — no API token secret needed.
# One-time setup, on BOTH pypi.org and test.pypi.org, add a (pending) trusted publisher:
#   Project: illumio-py-open | Owner: alexgoller | Repo: illumio-py
#   Workflow: release.yml     | Environment: pypi (on PyPI) / testpypi (on TestPyPI)
# Also create matching GitHub environments named "pypi" and "testpypi".
# (Token alternative: set PYPI_API_TOKEN / TEST_PYPI_API_TOKEN secrets and pass
#  `password:` to the publish action instead of using id-token.)

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . requests-mock pytest pytest-cov
          python -m pytest tests/unit -q

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so setuptools_scm sees the version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  classify:
    name: Classify release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - id: check
        run: |
          # Final release iff the tag is exactly vN.N.N (no rc/a/b/dev suffix).
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Final release: ${GITHUB_REF_NAME} -> PyPI"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release: ${GITHUB_REF_NAME} -> TestPyPI (dry run)"
          fi

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: [build, classify]
    if: needs.classify.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/illumio-py-open
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, classify]
    if: needs.classify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/illumio-py-open
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
